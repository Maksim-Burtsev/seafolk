<style>
:root {
  color-scheme: light;
  --ground:    #e9eeef;
  --surface:   #f7f9f9;
  --hairline:  #cfdadc;
  --ink:       #0f1a1d;
  --label:     #55676c;
  --accent:    #eb6834;
  --accent-tx: #b8441a;
  --working:   #7d8f94;
  --ref:       #a8b8bc;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:    #0b1416;
    --surface:   #122023;
    --hairline:  #23383c;
    --ink:       #e8eeef;
    --label:     #9db0b4;
    --accent:    #f07a45;
    --accent-tx: #f79367;
    --working:   #7b8f94;
    --ref:       #47605f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:    #0b1416;
  --surface:   #122023;
  --hairline:  #23383c;
  --ink:       #e8eeef;
  --label:     #9db0b4;
  --accent:    #f07a45;
  --accent-tx: #f79367;
  --working:   #7b8f94;
  --ref:       #47605f;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 400 17px/1.65 Karla, ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding: clamp(28px, 6vw, 72px) clamp(18px, 4vw, 40px) 64px;
  display: flex;
  flex-direction: column;
  gap: 40px;
}
.prose { max-width: 64ch; display: flex; flex-direction: column; gap: 18px; }

.eyebrow {
  font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--label);
  margin: 0;
}
h1 {
  font: 400 clamp(38px, 7vw, 68px)/1.02 "Bodoni Moda", Georgia, serif;
  letter-spacing: -.015em;
  text-wrap: balance;
  margin: 0;
}
h1 em { font-style: italic; color: var(--accent-tx); }
.deck { font-size: clamp(18px, 2.1vw, 21px); color: var(--label); margin: 0; text-wrap: pretty; }
p { margin: 0; text-wrap: pretty; }
strong { font-weight: 600; }
.num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

/* ---- controls ---- */
.controls { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; }
.seg { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 2px; padding: 2px; }
.seg button {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  color: var(--label); border-radius: 1px; padding: 7px 14px;
  font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .09em; text-transform: uppercase; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- dials ---- */
.dials {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: clamp(14px, 2.4vw, 30px);
}
.dial {
  background: var(--surface);
  border: 1px solid var(--hairline);
  padding: 18px 14px 20px;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.dial h2 {
  font: 400 22px/1 "Bodoni Moda", Georgia, serif;
  margin: 0; text-align: center;
}
.dial .sub {
  font: 400 11px/1.35 "IBM Plex Mono", ui-monospace, monospace;
  color: var(--label); text-align: center; letter-spacing: .04em;
  min-height: 2.7em;
}
.dial svg { width: 100%; height: auto; display: block; }
.dial--subject { border-color: var(--accent); }
.dial--subject h2 { color: var(--accent-tx); }

.sector { transition: opacity .12s ease; }
@media (prefers-reduced-motion: reduce) { .sector { transition: none; } }
.dial:hover .sector { opacity: .45; }
.dial .sector:hover, .dial .sector.on { opacity: 1; }
.hit { fill: transparent; cursor: crosshair; }

.readout {
  font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
  color: var(--label); letter-spacing: .04em; min-height: 1em;
}
.readout b { color: var(--ink); font-weight: 500; }

figcaption { font-size: 14px; color: var(--label); max-width: 74ch; }

/* ---- table fallback ---- */
details { border-top: 1px solid var(--hairline); padding-top: 16px; }
summary {
  cursor: pointer; color: var(--label);
  font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: .09em; text-transform: uppercase;
}
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.scroll { overflow-x: auto; margin-top: 14px; }
table { border-collapse: collapse; font-size: 13px; }
th, td {
  padding: 5px 9px; text-align: right; white-space: nowrap;
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;
}
th { color: var(--label); font-weight: 500; border-bottom: 1px solid var(--hairline); }
tbody th { text-align: left; border-bottom: 0; }

footer {
  border-top: 1px solid var(--hairline); padding-top: 20px;
  font-size: 14px; color: var(--label); max-width: 74ch;
  display: flex; flex-direction: column; gap: 10px;
}
code {
  font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .92em;
  background: var(--surface); border: 1px solid var(--hairline); padding: 1px 5px;
}
</style>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const FLEETS = ["leisure", "ferries", "cargo", "fishing"];
const FLAT = 100 / 24;                       // a day with no rhythm: 4.167 % an hour

const T = {
  ru: {
    eyebrow: "Seafolk · фаза 0 · июль 2025",
    title: 'Когда просыпается <em>море</em>',
    deck: "Четыре флота делят одну и ту же воду и живут по четырём разным часам. Пунктирный круг — сутки без ритма: 4,17 % движения в каждый час. Прогулочный флот вылетает за него в полдень и почти исчезает ночью. Рабочее море к нему прижато.",
    d_weekday: "Будни", d_sat: "Суббота", d_sun: "Воскресенье",
    fleet: { leisure: "Прогулочные", ferries: "Паромы", cargo: "Грузовые", fishing: "Рыболовные" },
    sub: {
      leisure: "Class B · частные суда,\nтолько агрегаты",
      ferries: "Class A · пассажирские",
      cargo: "Class A · сухогрузы\nи танкеры",
      fishing: "Class A · рыболовные"
    },
    caption: "Доля движения флота, приходящаяся на каждый час местного времени (Europe/Copenhagen). Полночь наверху, полдень внизу. Радиус линеен по доле. Каждый флот нормирован сам на себя — сравнивать можно форму, но не размер: Class B выходит в эфир реже, чем Class A.",
    read1: "Прогулочный флот кладёт <b class='num'>12,1 %</b> суточного движения в один полуденный час — почти втрое больше плоских суток — и <b class='num'>3,8 %</b> в ночь с 22 до 5. Это не флот, это распорядок дня.",
    read2: "Грузовые и рыболовные суда пикуют <strong>ночью</strong>: их самые занятые часы — 2 и 0 соответственно, а на ночь приходится <b class='num'>32,7 %</b> и <b class='num'>36,0 %</b> движения. Порт работает, пока город спит. Паромы держатся ровно и добавляют вечерний горб к 17 часам.",
    read3: "Переключите на субботу и воскресенье: у прогулочного флота колокол сдвигается на час позже и становится шире, у остальных трёх не меняется почти ничего. В июле разница между выходным и будним днём мала — это месяц отпусков, и под парусом ходят во вторник.",
    table_toggle: "Показать числа",
    hour: "час",
    method: "Настоящие данные, не макет: 92 полных суток из открытого датского AIS-архива (январь, июнь и июль 2025), 1 878 644 705 строк прочитано, 1 735 448 756 оставлено. На этой странице показан июль. Частные суда попадают сюда только агрегатами — ни одного MMSI, имени или трека Class B.",
    repro: "Запрос: <code>sql/12_day_profile.sql</code>. Числа на странице обновляются командой <code>scripts/build_site_data.sh</code>. Источник: Danish Maritime Authority, aisdata.ais.dk."
  },
  en: {
    eyebrow: "Seafolk · phase 0 · July 2025",
    title: 'When the sea <em>wakes</em>',
    deck: "Four fleets share the same water and keep four different clocks. The dashed circle is a day with no rhythm: 4.17 % of the movement in every hour. The leisure fleet blows past it at noon and nearly vanishes at night. The working sea hugs it.",
    d_weekday: "Weekday", d_sat: "Saturday", d_sun: "Sunday",
    fleet: { leisure: "Leisure", ferries: "Ferries", cargo: "Cargo", fishing: "Fishing" },
    sub: {
      leisure: "Class B · private boats,\naggregates only",
      ferries: "Class A · passenger",
      cargo: "Class A · cargo\nand tankers",
      fishing: "Class A · fishing"
    },
    caption: "Share of each fleet's movement falling in each hour of local time (Europe/Copenhagen). Midnight at the top, noon at the bottom. Radius is linear in share. Each fleet is normalised against itself — compare the shapes, never the sizes: Class B reports less often than Class A.",
    read1: "The leisure fleet puts <b class='num'>12.1 %</b> of a day's movement into one midday hour — nearly three times a flat day — and <b class='num'>3.8 %</b> into the night between 22:00 and 05:00. That is not a fleet, it is a daily routine.",
    read2: "Cargo and fishing peak <strong>at night</strong>: their busiest hours are 02:00 and 00:00, and the night carries <b class='num'>32.7 %</b> and <b class='num'>36.0 %</b> of their movement. The port works while the town sleeps. Ferries stay level and add an evening shoulder around 17:00.",
    read3: "Switch to Saturday and Sunday: the leisure bell moves an hour later and broadens, and almost nothing changes for the other three. In July the gap between a weekend and a weekday is small — it is the holiday month, and people sail on a Tuesday.",
    table_toggle: "Show the numbers",
    hour: "hour",
    method: "Real data, not a mock: 92 whole days of the open Danish AIS archive (January, June and July 2025), 1 878 644 705 rows read, 1 735 448 756 kept. This page shows July. Private vessels appear only as aggregates — no MMSI, name or track of a Class B boat is anywhere in it.",
    repro: "Query: <code>sql/12_day_profile.sql</code>. The numbers on this page are refreshed by <code>scripts/build_site_data.sh</code>. Source: Danish Maritime Authority, aisdata.ais.dk."
  }
};

let lang = "ru", day = "weekday";

const R_IN = 20, R_MAX = 92, PEAK = 13;      // % that reaches the outer edge
const r = v => R_IN + (Math.min(v, PEAK) / PEAK) * (R_MAX - R_IN);
const pt = (deg, rad) => {
  const a = (deg - 90) * Math.PI / 180;
  return [(120 + rad * Math.cos(a)).toFixed(2), (120 + rad * Math.sin(a)).toFixed(2)];
};
function sector(hour, value, gapDeg) {
  const half = 7.5 - gapDeg, c = hour * 15;
  const a0 = c - half, a1 = c + half, ro = r(value);
  const [x1, y1] = pt(a0, R_IN), [x2, y2] = pt(a0, ro);
  const [x3, y3] = pt(a1, ro),   [x4, y4] = pt(a1, R_IN);
  return `M${x1} ${y1}L${x2} ${y2}A${ro} ${ro} 0 0 1 ${x3} ${y3}L${x4} ${y4}A${R_IN} ${R_IN} 0 0 0 ${x1} ${y1}Z`;
}

function drawDial(fleet) {
  const hours = DATA[day][fleet];
  const subject = fleet === "leisure";
  const fill = subject ? "var(--accent)" : "var(--working)";
  const ticks = [0, 6, 12, 18].map(h => {
    const [x, y] = pt(h * 15, R_MAX + 15);
    return `<text x="${x}" y="${y}" fill="var(--label)" font-family="IBM Plex Mono, monospace"
             font-size="10" text-anchor="middle" dominant-baseline="central">${String(h).padStart(2, "0")}</text>`;
  }).join("");
  const wedges = hours.map((v, h) =>
    `<path class="sector" d="${sector(h, v, 0.9)}" fill="${fill}"/>` +
    `<path class="hit" d="${sector(h, PEAK, 0)}" data-h="${h}" data-v="${v}"/>`
  ).join("");
  return `
  <div class="dial ${subject ? "dial--subject" : ""}" data-fleet="${fleet}">
    <h2>${T[lang].fleet[fleet]}</h2>
    <div class="sub">${T[lang].sub[fleet].replace("\n", "<br>")}</div>
    <svg viewBox="0 0 240 240" role="img" aria-label="${T[lang].fleet[fleet]}">
      <circle cx="120" cy="120" r="${r(FLAT)}" fill="none" stroke="var(--ref)"
              stroke-width="1" stroke-dasharray="3 3"/>
      ${wedges}${ticks}
    </svg>
    <div class="readout" aria-live="polite"></div>
  </div>`;
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t[el.dataset.t]; });
  document.querySelectorAll("[data-day]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.day === day)));
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.getElementById("dials").innerHTML = FLEETS.map(drawDial).join("");
  renderTable();
}

function renderTable() {
  const t = T[lang];
  const head = `<thead><tr><th>${t.hour}</th>${FLEETS.map(f => `<th>${t.fleet[f]}</th>`).join("")}</tr></thead>`;
  const rows = Array.from({ length: 24 }, (_, h) =>
    `<tr><th>${String(h).padStart(2, "0")}:00</th>` +
    FLEETS.map(f => `<td>${DATA[day][f][h].toFixed(1)}</td>`).join("") + "</tr>").join("");
  document.getElementById("table").innerHTML = head + `<tbody>${rows}</tbody>`;
}

document.addEventListener("pointerover", e => {
  const hit = e.target.closest(".hit");
  if (!hit) return;
  const dial = hit.closest(".dial");
  const h = +hit.dataset.h;
  dial.querySelectorAll(".sector").forEach((s, i) => s.classList.toggle("on", i === h));
  dial.querySelector(".readout").innerHTML =
    `${String(h).padStart(2, "0")}:00 · <b>${(+hit.dataset.v).toFixed(1)} %</b>`;
});
document.addEventListener("pointerleave", e => {
  const dial = e.target.closest?.(".dial");
  if (!dial) return;
  dial.querySelectorAll(".sector").forEach(s => s.classList.remove("on"));
  dial.querySelector(".readout").textContent = "";
}, true);

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.day) day = b.dataset.day;
  else if (b.dataset.lang) lang = b.dataset.lang;
  else return;
  render();
});

render();
</script>
