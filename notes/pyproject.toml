[project]
name = "seafolk-notes"
version = "0"
description = "Validation plots for the Seafolk sessions. Not a package."
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.9"]

# rasterio is a 69 MB wheel and ONE file imports it (notes/emodnet.py, which
# reads the EMODnet GeoTIFFs). Keeping it out of `dependencies` means every
# other `uv run --project notes …` caller — the six plot scripts — does not
# install it. Run the one file that needs it with:
#   uv run --project notes --group emodnet notes/emodnet.py
[dependency-groups]
emodnet = ["rasterio>=1.4"]

[tool.uv]
package = false
